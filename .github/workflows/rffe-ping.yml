name: MobileDoctor RFFE weekly ping

on:
  schedule:
    - cron: '17 3 * * 1' # Monday 09:47 Myanmar time
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check read-only gateway
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            --output /dev/null \
            --write-out 'HTTP %{http_code}\n' \
            'https://hrtgscrbcbnftfczhsbn.supabase.co/functions/v1/rffe-gateway?action=profiles&offset=0'
